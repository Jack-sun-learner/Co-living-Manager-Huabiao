const avatar=(i)=>`<span class="avatar" style="background:${colors[i]}">${members[i][0]}</span>`;const opts=(selected=state.me)=>members.map((n,i)=>`<option value="${i}" ${i===selected?'selected':''}>${n}${i===state.me?'（我）':''}</option>`).join('');
function shares(e){let a=Math.floor(e.amount/e.people.length),r=e.amount%e.people.length;return e.people.map((p,i)=>({person:p,amount:a+(i<r?1:0)}))}function balance(){let b=[0,0,0,0];state.expenses.filter(e=>!e.settled).forEach(e=>{b[e.payer]+=e.amount;shares(e).forEach(s=>b[s.person]-=s.amount)});return b}function transfers(){let b=balance(),out=[],debt=b.map((v,i)=>({v:-v,i})).filter(x=>x.v>0),credit=b.map((v,i)=>({v,i})).filter(x=>x.v>0);for(let d of debt)for(let c of credit){let a=Math.min(d.v,c.v);if(a){out.push({from:d.i,to:c.i,amount:a});d.v-=a;c.v-=a}}return out}
const art=`<svg viewBox="0 0 300 180" aria-label="温暖的合租客厅插画" role="img"><ellipse cx="155" cy="158" rx="123" ry="13" fill="#dce5cd"/><rect x="147" y="16" width="70" height="73" rx="3" fill="#c6d5b1"/><rect x="152" y="21" width="60" height="63" fill="#f8f9ed"/><path d="M182 21v63M152 52h60" stroke="#c6d5b1" stroke-width="4"/><path d="M157 76 177 48l18 28" fill="#e2eacb"/><rect x="58" y="95" width="132" height="54" rx="12" fill="#92a982"/><rect x="65" y="84" width="58" height="47" rx="10" fill="#a9bc96"/><rect x="125" y="84" width="58" height="47" rx="10" fill="#a3b68e"/><rect x="49" y="111" width="20" height="37" rx="8" fill="#849e72"/><rect x="179" y="111" width="20" height="37" rx="8" fill="#849e72"/><rect x="75" y="100" width="30" height="26" rx="5" fill="#f0e7cc" transform="rotate(-9 75 100)"/><path d="M65 148v9m119-9v9" stroke="#718561" stroke-width="5"/><path d="M32 128V70" stroke="#819768" stroke-width="3"/><path d="M31 102C7 100 9 79 30 84M33 90c26-1 23-25 2-15M31 73C12 69 17 49 32 57" fill="#a7bc8d"/><path d="M18 126h28l-4 31H23Z" fill="#d2ba95"/><path d="M251 141V55" stroke="#a39878" stroke-width="3"/><path d="m231 58 8-28h24l8 28Z" fill="#f6efd7"/><ellipse cx="251" cy="144" rx="17" ry="4" fill="#a39878"/><ellipse cx="203" cy="141" rx="37" ry="10" fill="#d3bd96"/><path d="m176 143-3 18m57-18 3 18" stroke="#b09d7e" stroke-width="4"/><rect x="195" y="126" width="12" height="13" rx="3" fill="#f8f6e8"/><path d="M208 129q9-1 4 7h-4" fill="none" stroke="#f8f6e8" stroke-width="2"/><rect x="80" y="23" width="30" height="36" rx="2" fill="#f4f3df"/><circle cx="95" cy="36" r="7" fill="#d6c793"/><path d="m84 52 8-11 14 11" fill="#b9c8a2"/></svg>`;
const navs=[['overview','home','生活概览'],['expenses','wallet','费用 AA'],['chores','clean','清洁值日'],['supplies','box','公共物品'],['rules','file','室友公约']];
function go(p){page=p;filter='all';render();window.scrollTo({top:0,behavior:'smooth'})}function heading(title,sub,button=''){return`<div class="page-heading"><div><h1>${title}</h1><p class="sub">${sub}</p></div>${button}</div>`}const addBtn=(text,fn)=>`<button class="btn primary" onclick="${fn}">${icon('plus')}${text}</button>`;
function expenseList(list){return list.length?list.map(e=>`<div class="expense"><div class="expense-icon">${icon(e.category==='房租'?'home':e.category==='水电'?'water':'box')}</div><div class="grow"><b>${esc(e.name)}</b><div class="meta">${esc(e.date.slice(5))} · ${members[e.payer]}垫付 · ${e.people.length} 人分摊</div></div><div><div class="amount">¥ ${money(e.amount)}</div><span class="badge ${e.settled?'':'warn'}">${e.settled?'已结清':'待结算'}</span></div><button class="link" onclick="expenseDetail('${e.id}')" aria-label="查看${esc(e.name)}明细">${icon('arrow')}</button></div>`).join(''):'<div class="empty">还没有账单，记下第一笔共同开销吧。</div>'}
function choreList(list){return list.length?list.map(c=>`<div class="chore ${c.done?'complete':''}"><button class="check ${c.done?'done':''}" onclick="toggleChore('${c.id}')" aria-label="${c.done?'撤销完成':'完成'}${esc(c.name)}" aria-pressed="${c.done}">${c.done?icon('check'):''}</button><div class="grow"><b>${esc(c.name)}</b><div class="meta">${esc(c.area)} · <span class="${!c.done&&c.date<=today?'today':''}">${c.date===today?'今天':esc(c.date.slice(5))}${!c.done&&c.date<today?' · 已逾期':''}</span></div></div>${avatar(c.person)}<button class="link" onclick="reassign('${c.id}')" title="调整负责人">${c.person===state.me?'我':members[c.person].slice(1)}</button></div>`).join(''):'<div class="empty">这一刻，没有待办。享受清爽的小家吧。</div>'}
function supplyCard(i,full=false){return`<div class="supply ${i.qty<=i.threshold?'low':''}"><div class="supply-icon">${icon(i.name.includes('液')?'water':'box')}</div><b>${esc(i.name)}</b><div class="stockbar"><div style="width:${Math.min(100,i.qty/i.max*100)}%"></div></div><div class="meta">剩余 ${i.qty} ${esc(i.unit)} ${i.qty<=i.threshold?'· <span class="today">需要补货</span>':'· 库存充足'}</div>${full?`<div class="meta">${members[i.owner]}负责 · ≤ ${i.threshold} ${esc(i.unit)}提醒</div><div class="supply-controls"><button class="btn small" onclick="consume('${i.id}')" ${i.qty===0?'disabled':''}>领用 1 ${esc(i.unit)}</button><button class="btn small" onclick="restock('${i.id}')">＋ 补货</button></div>`:''}</div>`}
function render(){document.getElementById('nav').innerHTML=navs.map(([id,ic,name])=>`<button class="${page===id?'active':''}" onclick="go('${id}')" ${page===id?'aria-current="page"':''}>${icon(ic)}<span>${name}</span>${id==='supplies'?`<span class="count">${state.items.filter(i=>i.qty<=i.threshold).length}</span>`:''}</button>`).join('');document.getElementById('crumb').textContent=navs.find(n=>n[0]===page)[2];document.getElementById('identity').innerHTML=opts();document.getElementById('myAvatar').textContent=members[state.me][0];document.getElementById('content').innerHTML=({overview:overview,expenses:expensesPage,chores:choresPage,supplies:suppliesPage,rules:rulesPage}[page])();document.querySelectorAll('[data-icon]').forEach(el=>el.innerHTML=icon(el.dataset.icon))}
function overview(){let monthly=state.expenses.filter(e=>e.date.slice(0,7)===today.slice(0,7)),total=monthly.reduce((a,e)=>a+e.amount,0),b=balance()[state.me],tasks=state.chores.filter(c=>!c.done&&c.person===state.me),low=state.items.filter(i=>i.qty<=i.threshold),pending=state.rules.filter(r=>!r.votes.includes(state.me));return heading(`你好，${members[state.me].slice(1)} <span style="font-size:22px">☀</span>`,'小家的日常，都在这里井井有条。',addBtn('记一笔','openExpense()'))+`<section class="hero"><div class="hero-copy"><div class="eyebrow">OUR LITTLE HOME · 梧桐里 302</div><h2>住在一起，也把生活过好。</h2><p>账目清楚一点，家务分担一点，生活轻松一点。</p><button class="btn small" onclick="go('rules')">看看我们的约定 ${icon('arrow')}</button></div><div class="hero-art">${art}</div></section><div class="stats">${[['本月共同支出','wallet',`<small>¥</small> ${money(total)}`,`${monthly.length} 笔账单 · 每一笔都有记录`],['我的待结算','wallet',`<small>${b>0?'待收 ¥':'待付 ¥'}</small> ${money(Math.abs(b))}`,`<strong>${b===0?'当前账目已平衡':'点击费用 AA 查看结算方案'}</strong>`],['我的待办值日','clean',`${tasks.length} <small>项</small>`,tasks.length?'做一点小事，让家更舒服':'<strong>完成啦，辛苦了！</strong>'],['需要补货','box',`${low.length} <small>件</small>`,low.length?low.map(i=>esc(i.name)).join('、'):'<strong>日常所需，库存充足</strong>']].map(([t,i,v,f])=>`<div class="stat"><div class="stat-top">${t}<span class="stat-icon">${icon(i)}</span></div><div class="stat-value">${v}</div><div class="stat-foot">${f}</div></div>`).join('')}</div><div class="columns"><div class="stack"><section class="card"><div class="card-head"><h2>${icon('wallet')}最近账单</h2><button class="link" onclick="go('expenses')">全部账单 ↗</button></div><div class="tabs"><button class="${filter==='all'?'selected':''}" onclick="filter='all';render()">全部</button><button class="${filter==='pending'?'selected':''}" onclick="filter='pending';render()">待结算</button></div>${expenseList(state.expenses.filter(e=>filter==='all'||!e.settled).slice(0,3))}<div class="card-footer"><span>透明分摊，少一点不好意思。</span><button class="link" onclick="openSettlement()">查看结算 ${icon('arrow')}</button></div></section><section class="card"><div class="card-head"><h2>${icon('box')}家里的日常补给</h2><button class="link" onclick="go('supplies')">管理物品 ↗</button></div><div class="inventory-grid">${state.items.slice(0,3).map(i=>supplyCard(i)).join('')}</div></section></div><div class="stack"><section class="card"><div class="card-head"><h2>${icon('clean')}近日值日</h2><button class="link" onclick="go('chores')">排班表 ↗</button></div><div class="chores">${choreList(state.chores.filter(c=>c.date<=offset(1)).slice(0,3))}</div><div class="card-footer"><span>小小的付出，大家都看得见。</span>${icon('leaf')}</div></section><section class="card"><div class="card-head"><h2>${icon('file')}我们的室友公约</h2><span class="badge">${pending.length?pending.length+' 条待我确认':'全部已确认'}</span></div><div class="agreement-preview"><div class="quote">${esc(state.rules[0]?.body||'一起写下小家的第一条约定吧。')}</div><div class="avatars">${members.map((_,i)=>avatar(i)).join('')}<span class="meta">4 位室友，共同守护小家的默契</span></div><button class="link more-space" onclick="go('rules')">查看全部公约 ${icon('arrow')}</button></div></section></div></div>`}
function expensesPage(){return heading('费用 AA','大到房租，小到一包纸巾，每一笔都清清楚楚。',addBtn('记一笔','openExpense()'))+`<div class="notice">按分精确分摊；不能整除的尾差按参与人顺序分配。结算方案自动合并往来，减少转账次数。</div><div class="columns"><section class="card"><div class="card-head"><h2>共同账本</h2><button class="link" onclick="exportData()">导出数据 ↓</button></div><div class="tabs">${[['all','全部'],['pending','待结算'],['settled','已结清']].map(([v,n])=>`<button class="${filter===v?'selected':''}" onclick="filter='${v}';render()">${n}</button>`).join('')}</div>${expenseList(state.expenses.filter(e=>filter==='all'||(filter==='settled'?e.settled:!e.settled)))}</section><section class="card"><div class="card-head"><h2>室友往来余额</h2></div><div class="full-pad">${balance().map((b,i)=>`<div class="summary-row">${avatar(i)}<div class="grow">${members[i]}${i===state.me?' · 我':''}</div><div style="color:${b<0?'#b38a53':'#24765e'}">${b===0?'已平衡':`${b>0?'待收':'待付'} ¥ ${money(Math.abs(b))}`}</div></div>`).join('')}<button class="btn primary more-space" onclick="openSettlement()" style="width:100%">查看合并结算方案 ${icon('arrow')}</button><p class="meta">仅统计未结清账单；实际转账后再确认结清。</p></div></section></div>`}
function choresPage(){let d=new Date();let monday=new Date(d);monday.setDate(d.getDate()-((d.getDay()+6)%7));return heading('清洁值日','公平轮换，各尽一份力。干净的小家，大家都喜欢。',addBtn('添加值日','openChore()'))+`<section class="card"><div class="card-head"><h2>本周生活日历</h2><button class="btn small" onclick="rotateWeek()">生成下周轮值</button></div><div class="week">${Array.from({length:7},(_,i)=>{let t=new Date(monday);t.setDate(t.getDate()+i);let dt=dateISO(t);return`<div class="day ${dt===today?'is-today':''}">周${'一二三四五六日'[i]}<b>${t.getDate()}</b>${state.chores.filter(c=>c.date===dt).length} 项值日</div>`}).join('')}</div><div class="tabs">${[['all','全部值日'],['mine','我的值日'],['pending','未完成']].map(([v,n])=>`<button class="${filter===v?'selected':''}" onclick="filter='${v}';render()">${n}</button>`).join('')}</div><div class="chores">${choreList(state.chores.filter(c=>filter==='all'||(filter==='mine'?c.person===state.me:!c.done)).sort((a,b)=>a.date.localeCompare(b.date)))}</div></section><p class="meta">点击方框完成打卡；点击负责人调整分工。下周轮值按室友顺序轮换，避免总是同一个人做同一件事。</p>`}
function suppliesPage(){return heading('公共物品','用多少，记多少。快用完之前，给小家一个提醒。',addBtn('登记物品','openItem()'))+`<div class="notice">${state.items.filter(i=>i.qty<=i.threshold).length} 件物品已到补货提醒线。领用和补货都会留下记录，负责人可及时跟进。</div><div class="supply-full">${state.items.map(i=>supplyCard(i,true)).join('')}</div><section class="card more-space"><div class="card-head"><h2>小家动态</h2></div><div class="full-pad history">${state.logs.length?state.logs.map(l=>`<p>${esc(l.text)}<br><span class="meta">${esc(l.time)}</span></p>`).join(''):'<p class="meta">还没有操作记录，试着领用一份物品吧。</p>'}</div></section>`}
function rulesPage(){return heading('室友公约','把边界提前说清，把体谅留在日常。',addBtn('发起新公约','openRule()'))+`<div class="notice">每条公约由全体室友确认后生效。可在小家设置中切换室友，体验共同确认流程。</div><div class="rules">${state.rules.map((r,i)=>`<section class="card rule"><div style="display:flex;justify-content:space-between;gap:10px"><h2><span style="color:#a1b293;margin-right:12px">${String(i+1).padStart(2,'0')}</span>${esc(r.title)}</h2><span class="badge ${r.votes.length===4?'':'warn'}">${r.votes.length===4?'已生效':'待共识'}</span></div><p>${esc(r.body)}</p><div class="rule-bottom"><div><div class="avatars" style="margin:0">${r.votes.map(avatar).join('')}<span class="meta">${r.votes.length}/4 位已确认${r.votes.length<4?' · 等待 '+members.filter((_,i)=>!r.votes.includes(i)).join('、'):''}</span></div></div><button class="btn small ${r.votes.includes(state.me)?'':'primary'}" onclick="vote('${r.id}')">${r.votes.includes(state.me)?'已确认 · 撤回':'我同意这条公约'}</button></div></section>`).join('')}</div>`}
function modal(title,body){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;if(!document.getElementById('modal').open)document.getElementById('modal').showModal()}function closeModal(){document.getElementById('modal').close()}const actions=(label='保存')=>`<div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">取消</button><button class="btn primary" type="submit">${label}</button></div>`;
function openExpense(){modal('记下共同的一笔',`<form id="expenseForm"><label class="field">费用名称<input name="name" placeholder="例如：9 月电费" maxlength="45" required></label><div class="form-grid"><label class="field">金额（元）<input name="amount" type="number" min="0.01" max="9999999" step="0.01" placeholder="0.00" required oninput="updatePreview()"></label><label class="field">费用分类<select name="category"><option>日用</option><option>房租</option><option>水电</option><option>餐饮</option><option>其他</option></select></label></div><div class="form-grid"><label class="field">谁先垫付<select name="payer">${opts()}</select></label><label class="field">发生日期<input name="date" type="date" value="${today}" required></label></div><div class="field">参与分摊的室友<div class="members">${members.map((n,i)=>`<label><input type="checkbox" name="people" value="${i}" checked onchange="updatePreview()">${n}</label>`).join('')}</div></div><div class="preview" id="splitPreview">输入金额，即可预览每个人的分摊。</div>${actions('保存账单')}</form>`);document.getElementById('expenseForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),people=f.getAll('people').map(Number),amount=Math.round(Number(f.get('amount'))*100);if(!people.length)return toast('请至少选择一位参与分摊的室友');if(!f.get('name').trim()||!Number.isSafeInteger(amount)||amount<=0)return toast('请填写有效的名称和金额');state.expenses.unshift({id:uid(),name:f.get('name').trim(),amount,payer:+f.get('payer'),people,category:f.get('category'),date:f.get('date'),settled:false});log(`${members[state.me]}记录了账单「${f.get('name').trim()}」`);save();closeModal();render();toast('账单已保存，分摊明细已生成')}}
function updatePreview(){let f=new FormData(document.getElementById('expenseForm')),people=f.getAll('people').map(Number),amount=Math.round(Number(f.get('amount'))*100);document.getElementById('splitPreview').textContent=people.length&&amount>0?shares({people,amount}).map(s=>`${members[s.person]} ¥${money(s.amount)}`).join(' · '):'请输入金额并选择参与人。'}
function expenseDetail(id){let e=state.expenses.find(x=>x.id===id);modal(e.name,`<p class="sub">${esc(e.date)} · ${esc(e.category)} · ${members[e.payer]}垫付</p><div class="stat-value">¥ ${money(e.amount)}</div>${shares(e).map(s=>`<div class="summary-row">${avatar(s.person)}<span class="grow">${members[s.person]}</span><b>¥ ${money(s.amount)}</b></div>`).join('')}<p class="meta">${e.settled?'这笔账单已结清。':'每个人承担以上金额；垫付款计入付款人的待收余额。'}</p><div class="modal-actions">${!e.settled?`<button class="btn danger" onclick="deleteExpense('${e.id}')">删除误记账单</button>`:''}<button class="btn primary" onclick="closeModal()">知道了</button></div>`)}
function deleteExpense(id){modal('删除这笔账单？',`<p>删除后将重新计算室友往来余额。此操作仅影响当前浏览器的演示数据。</p><div class="modal-actions"><button class="btn" onclick="expenseDetail('${id}')">返回</button><button class="btn danger" onclick="state.expenses=state.expenses.filter(e=>e.id!=='${id}');save();closeModal();render();toast('账单已删除')">确认删除</button></div>`)}
function openSettlement(){let t=transfers(),pending=state.expenses.some(e=>!e.settled);modal('把账算清，轻松一点',`<div class="notice">以下为全部未结清账单合并后的转账建议。请完成真实转账，再由室友确认结清。</div>${t.length?t.map(x=>`<div class="summary-row"><span>${members[x.from]} → ${members[x.to]}</span><b>¥ ${money(x.amount)}</b></div>`).join(''):'<div class="empty">所有室友的往来余额已平衡。</div>'}<p class="meta">这里只记录结算状态，不会发起扣款或转账。</p>${pending?`<label class="field"><input id="confirmPaid" type="checkbox" style="display:inline;width:auto;margin-right:7px" onchange="document.getElementById('settleBtn').disabled=!this.checked">我确认所有室友已核对，并已完成上述转账</label><button id="settleBtn" class="btn primary" disabled onclick="settleAll()">确认全部结清</button>`:''}`)}
function settleAll(){if(!document.getElementById('confirmPaid')?.checked)return;state.expenses.forEach(e=>e.settled=true);log(`${members[state.me]}确认所有未结账单已完成结算`);save();closeModal();render();toast('结算已记录，账单保留在已结清列表')}
function toggleChore(id){let c=state.chores.find(c=>c.id===id);c.done=!c.done;log(`${members[state.me]}${c.done?'完成':'撤销完成'}值日「${c.name}」`);save();render();toast(c.done?'打卡成功，小家因为你更干净了':'已撤销完成状态')}
function openChore(){modal('给小家安排一件事',`<form id="choreForm"><label class="field">值日任务<input name="name" required maxlength="35" placeholder="例如：阳台整理"></label><label class="field">具体内容<input name="area" required maxlength="80" placeholder="需要做哪些事情？"></label><div class="form-grid"><label class="field">负责人<select name="person">${opts()}</select></label><label class="field">值日日期<input type="date" name="date" value="${today}" required></label></div>${actions('添加值日')}</form>`);document.getElementById('choreForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);if(!f.get('name').trim()||!f.get('area').trim())return toast('请填写任务和具体内容');state.chores.push({id:uid(),name:f.get('name').trim(),area:f.get('area').trim(),person:+f.get('person'),date:f.get('date'),done:false});save();closeModal();render();toast('值日已安排')}}
function reassign(id){let c=state.chores.find(c=>c.id===id);modal('调整值日负责人',`<form id="assignForm"><p>${esc(c.name)} · ${esc(c.date)}</p><label class="field">新的负责人<select name="person">${opts(c.person)}</select></label><p class="meta">请先和对方沟通好，再调整安排。</p>${actions('确认调整')}</form>`);document.getElementById('assignForm').onsubmit=e=>{e.preventDefault();c.person=+new FormData(e.target).get('person');log(`「${c.name}」调整为${members[c.person]}负责`);save();closeModal();render();toast('负责人已更新')}}
function rotateWeek(){let d=new Date();d.setDate(d.getDate()+7-((d.getDay()+6)%7));let start=dateISO(d);if(state.chores.some(c=>c.rotation===start))return toast('下周轮值已经生成，无需重复添加');let templates=[['厨房清洁','擦拭灶台 · 清理水槽'],['客厅整理','地面清扫 · 整理杂物'],['垃圾分类','分类打包 · 更换垃圾袋'],['卫生间清洁','清洁台面 · 地面消毒']];let round=Math.floor((d-new Date(2026,0,5))/(7*86400000));templates.forEach(([name,area],i)=>{let t=new Date(d);t.setDate(t.getDate()+i);state.chores.push({id:uid(),name,area,person:((round+i)%4+4)%4,date:dateISO(t),done:false,rotation:start})});save();render();toast('已生成下周 4 项轮值，每周自动换人')}
function openItem(){modal('登记公共物品',`<form id="itemForm"><label class="field">物品名称<input name="name" required maxlength="25" placeholder="例如：洗洁精"></label><div class="form-grid"><label class="field">当前数量<input name="qty" type="number" min="0" max="9999" step="1" value="3" required></label><label class="field">计量单位<input name="unit" value="瓶" maxlength="6" required></label><label class="field">补货提醒线（≤）<input name="threshold" type="number" min="0" max="9999" step="1" value="1" required></label><label class="field">补货负责人<select name="owner">${opts()}</select></label></div>${actions('登记物品')}</form>`);document.getElementById('itemForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);if(!f.get('name').trim()||!f.get('unit').trim())return toast('名称和单位不能为空');state.items.push({id:uid(),name:f.get('name').trim(),qty:+f.get('qty'),max:Math.max(1,+f.get('qty'),+f.get('threshold')*3),unit:f.get('unit').trim(),threshold:+f.get('threshold'),owner:+f.get('owner')});log(`${members[state.me]}登记了「${f.get('name').trim()}」`);save();closeModal();render();toast('物品已登记')}}
function consume(id){let i=state.items.find(i=>i.id===id);if(i.qty<1)return;i.qty--;log(`${members[state.me]}领用「${i.name}」1 ${i.unit}，剩余 ${i.qty} ${i.unit}`);save();render();toast(i.qty<=i.threshold?`已记录领用；${i.name}需要补货`:'领用已记录')}
function restock(id){let i=state.items.find(i=>i.id===id);modal(`补货 · ${i.name}`,`<form id="stockForm"><p class="sub">当前剩余 ${i.qty} ${esc(i.unit)} · ${members[i.owner]}负责</p><label class="field more-space">本次补货数量（${esc(i.unit)}）<input name="qty" type="number" min="1" max="9999" step="1" value="3" required></label>${actions('确认补货')}</form>`);document.getElementById('stockForm').onsubmit=e=>{e.preventDefault();let qty=+new FormData(e.target).get('qty');i.qty+=qty;i.max=Math.max(i.max,i.qty);log(`${members[state.me]}补充「${i.name}」${qty} ${i.unit}`);save();closeModal();render();toast('补货已登记；如有垫付，可到费用 AA 记一笔')}}
function openRule(){modal('写下新的共同约定',`<form id="ruleForm"><label class="field">公约标题<input name="title" required maxlength="45" placeholder="例如：关于共用冰箱"></label><label class="field">具体约定<textarea name="body" required maxlength="500" placeholder="说清楚场景和做法，让每个人都好执行。"></textarea></label><div class="preview">发起后视为你已同意，另外 3 位室友确认后生效。</div>${actions('发起公约')}</form>`);document.getElementById('ruleForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);if(!f.get('title').trim()||!f.get('body').trim())return toast('请填写标题和约定内容');state.rules.push({id:uid(),title:f.get('title').trim(),body:f.get('body').trim(),votes:[state.me]});save();closeModal();render();toast('公约已发起，等待其他室友确认')}}
function vote(id){let r=state.rules.find(r=>r.id===id),has=r.votes.includes(state.me);r.votes=has?r.votes.filter(i=>i!==state.me):[...r.votes,state.me];save();render();toast(has?'已撤回确认':r.votes.length===4?'全员已确认，公约正式生效':'已确认，感谢共同维护小家的默契')}
function openNotifications(){let tasks=state.chores.filter(c=>!c.done&&c.person===state.me),items=state.items.filter(i=>i.qty<=i.threshold),rules=state.rules.filter(r=>!r.votes.includes(state.me));modal('小家提醒',`<div class="notice">站内提醒会随记录更新；演示版不发送短信或系统推送。</div><h3>我的值日 · ${tasks.length}</h3>${tasks.map(c=>`<p class="meta">${esc(c.date)} · ${esc(c.name)}</p>`).join('')||'<p class="meta">暂无待办值日</p>'}<h3 class="more-space">需要补货 · ${items.length}</h3>${items.map(i=>`<p class="meta">${esc(i.name)}剩余 ${i.qty} ${esc(i.unit)} · ${members[i.owner]}负责</p>`).join('')||'<p class="meta">库存充足</p>'}<h3 class="more-space">待我确认的公约 · ${rules.length}</h3>${rules.map(r=>`<p class="meta">${esc(r.title)}</p>`).join('')||'<p class="meta">已全部确认</p>'}`)}
function exportData(){const url=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));let a=document.createElement('a');a.href=url;a.download=`同屋备份-${today}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('数据备份已导出')}
function openSettings(){modal('我们的小家',`<div class="notice">这是可以直接体验的产品雏形。数据保存在当前浏览器，不会与其他设备或室友实时同步。清除浏览器数据会清空记录。</div><label class="field">切换体验身份<select onchange="state.me=+this.value;save();render();toast('已切换室友身份')">${opts()}</select></label><h3>梧桐里 · 302</h3><p class="meta">${members.join(' · ')}</p><div class="modal-actions"><button class="btn" onclick="exportData()">导出数据</button><button class="btn danger" onclick="confirmReset()">重置演示</button></div>`)}
function confirmReset(){modal('恢复初始演示数据？','<p>当前浏览器中新增的账单、值日、物品和公约将被清除。可先导出备份。</p><div class="modal-actions"><button class="btn" onclick="openSettings()">取消</button><button class="btn danger" onclick="state=seed();save();closeModal();render();toast(\'已恢复初始演示\')">确认重置</button></div>')}
document.getElementById('identity').onchange=e=>{state.me=+e.target.value;save();render();toast('已切换为'+members[state.me])};document.getElementById('date').textContent=new Date().toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'long'});document.getElementById('modal').addEventListener('click',e=>{if(e.target===e.currentTarget){const r=e.currentTarget.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeModal()}});render();
</script></body></html>
